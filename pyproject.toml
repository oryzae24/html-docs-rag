[project]
name = "python-doc-rag-assistant"
version = "0.1.0"
description = "A citation-aware RAG proof of concept for Python documentation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "beautifulsoup4",
    "langchain-text-splitters",
    "lxml",
    "numpy",
]

[project.optional-dependencies]
inference = [
    "faiss-cpu==1.14.3",
    "sentence-transformers==5.6.1",
    "torch==2.11.0",
    "transformers==5.14.1",
]
evaluation-openai = [
    "openai>=2.50.0",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest",
    "ruff",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/python_doc_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["python_doc_rag_assistant.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
